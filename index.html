<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FairJ Goat Farming</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- PWA Manifest -->
    <link rel="manifest" href="data:application/json;charset=utf-8,{
      %22name%22: %22FairJ Goat Farming%22,
      %22short_name%22: %22FairJ Farm%22,
      %22start_url%22: %22/%22,
      %22display%22: %22standalone%22,
      %22background_color%22: %22%23ffffff%22,
      %22theme_color%22: %22%231e3a8a%22,
      %22icons%22: [{%22src%22: %22https://nsfragzhdzekjqapdjfs.supabase.co/storage/v1/object/public/product-images/Gemini_Generated_Image_5nrpjh5nrpjh5nrp.jpg%22, %22sizes%22: %22512x512%22, %22type%22: %22image/png%22}]
    }">
    <meta name="theme-color" content="#1e3a8a">
    <link rel="icon" type="image/png" href="https://nsfragzhdzekjqapdjfs.supabase.co/storage/v1/object/public/product-images/Gemini_Generated_Image_5nrpjh5nrpjh5nrp.jpg">
</head>
<body class="bg-gray-50 font-sans pb-20">

    <!-- Header -->
    <header class="bg-slate-900 text-white p-3 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img src="https://nsfragzhdzekjqapdjfs.supabase.co/storage/v1/object/public/product-images/Gemini_Generated_Image_5nrpjh5nrpjh5nrp.jpg" alt="FairJ Logo" class="h-10 w-10 rounded-full object-cover border-2 border-amber-500 bg-white">
            <div>
                <h1 class="text-sm font-bold tracking-wide">FairJ Goat Farming</h1>
                <p class="text-[10px] text-amber-400">📍 Islamabad, Pakistan</p>
            </div>
        </div>
        <button onclick="toggleAdminModal()" class="bg-amber-500 text-slate-900 px-3 py-1 rounded text-xs font-bold shadow hover:bg-amber-400">Admin</button>
    </header>

    <!-- Highlighted Running News/Export Banner -->
    <div class="bg-amber-400 text-slate-950 py-2.5 overflow-hidden border-b-2 border-amber-500 shadow-sm sticky top-[52px] z-40">
        <marquee behavior="scroll" direction="left" scrollamount="6" class="font-black text-sm md:text-base tracking-wide flex items-center">
            🌍 <span class="bg-slate-900 text-amber-400 px-2 py-0.5 rounded mr-2 uppercase">Important Announcement:</span> Mutton Export is available exclusively for <span class="underline decoration-2 decoration-red-600">Saudi Arabia</span>, <span class="underline decoration-2 decoration-red-600">Qatar</span>, and <span class="underline decoration-2 decoration-red-600">Oman</span>. ✈️ Certified Quality Meat & Live Goats.
        </marquee>
    </div>

    <!-- Direct One-Click Install Banner -->
    <div id="installBanner" class="hidden bg-gradient-to-r from-slate-900 to-slate-700 text-white p-4 text-center shadow-lg sticky top-28 z-40 border-b-2 border-amber-500">
        <div class="max-w-md mx-auto flex flex-col items-center gap-2">
            <p class="text-sm font-bold">📲 Mobile Screen Par FairJ App Lagayein!</p>
            <button id="installBtn" class="bg-amber-500 text-slate-900 px-6 py-2 rounded-full text-sm font-extrabold shadow-md hover:bg-amber-400 active:scale-95 transition">✨ App Install Karein</button>
        </div>
    </div>

    <!-- Category Tabs (3 Categories) -->
    <div class="flex justify-center gap-3 my-4 px-4 overflow-x-auto pb-2">
        <button onclick="filterCategory('Goats')" id="btnGoats" class="px-5 py-2 rounded-full font-bold bg-slate-900 text-white shadow text-xs whitespace-nowrap">Goats</button>
        <button onclick="filterCategory('Green Bio Gas')" id="btnGreenBioGas" class="px-5 py-2 rounded-full font-bold bg-gray-200 text-gray-700 text-xs whitespace-nowrap">Green Bio Gas</button>
        <button onclick="filterCategory('Fertilizer')" id="btnFertilizer" class="px-5 py-2 rounded-full font-bold bg-gray-200 text-gray-700 text-xs whitespace-nowrap">Fertilizer</button>
    </div>

    <!-- Product Grid -->
    <main id="productGrid" class="grid grid-cols-2 gap-4 px-4 max-w-lg mx-auto">
        <!-- Products will load here automatically -->
    </main>

    <!-- Admin Modal -->
    <div id="adminModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50 p-4">
        <div class="bg-white rounded-lg p-6 w-full max-w-md max-h-[90vh] overflow-y-auto">
            <h2 class="text-lg font-bold mb-4 text-slate-900">Admin Panel - FairJ Farm</h2>
            <div id="adminLoginForm">
                <input type="email" id="adminEmail" placeholder="Admin Email" class="w-full border p-2 mb-2 rounded text-sm">
                <input type="password" id="adminPassword" placeholder="Password" class="w-full border p-2 mb-4 rounded text-sm">
                <button onclick="loginAdmin()" class="w-full bg-slate-900 text-white py-2 rounded font-bold text-sm">Login</button>
            </div>
            <div id="adminUploadForm" class="hidden">
                <p class="text-green-600 font-semibold mb-2 text-sm">✓ Logged in as Admin</p>
                <input type="text" id="pTitle" placeholder="Product Name" class="w-full border p-2 mb-2 rounded text-sm">
                <select id="pCategory" class="w-full border p-2 mb-2 rounded text-sm">
                    <option value="Goats">Goats</option>
                    <option value="Green Bio Gas">Green Bio Gas</option>
                    <option value="Fertilizer">Fertilizer</option>
                </select>
                <input type="number" id="pPrice" placeholder="Price (Rs)" class="w-full border p-2 mb-2 rounded text-sm">
                <input type="text" id="pStock" placeholder="Stock Status (e.g. In Stock / Available)" value="In Stock" class="w-full border p-2 mb-2 rounded text-sm">
                <textarea id="pDesc" placeholder="Variations / Details (e.g. Weight, Breed, Size)" class="w-full border p-2 mb-2 rounded text-sm"></textarea>
                
                <label class="block text-xs font-medium text-gray-700 mb-1">Select Images (Max 6 images):</label>
                <input type="file" id="pImage" accept="image/*" multiple onchange="previewImages(this)" class="w-full border p-2 mb-2 rounded text-sm">
                
                <div id="imagePreviewContainer" class="flex gap-2 mb-4 overflow-x-auto"></div>

                <button onclick="uploadProduct()" class="w-full bg-amber-500 text-slate-900 py-2 rounded font-bold text-sm mb-2 hover:bg-amber-400">Publish Product</button>
                <button onclick="logoutAdmin()" class="w-full bg-gray-400 text-white py-2 rounded font-bold text-sm">Logout</button>
            </div>
            <button onclick="toggleAdminModal()" class="w-full mt-4 text-gray-500 text-sm">Close</button>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const SUPABASE_URL = "https://nsfragzhdzekjqapdjfs.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zZnJhZ3poZHpla2pxYXBkamZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MTA0NjAsImV4cCI6MjEwNzM4NjQ2MH0.1z7POYoAjv04D6tx3A9unB9_QluNRslrUNA1YM0p6Kw";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentCategory = 'Goats';
        let deferredPrompt = null;
        let isAdminLoggedIn = false;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBanner').classList.remove('hidden');
        });

        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('installBanner').classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });

        function toggleAdminModal() {
            const modal = document.getElementById('adminModal');
            modal.classList.toggle('hidden');
        }

        async function loginAdmin() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                alert('Login Failed: ' + error.message);
            } else {
                isAdminLoggedIn = true;
                alert('Login Successful!');
                document.getElementById('adminLoginForm').classList.add('hidden');
                document.getElementById('adminUploadForm').classList.remove('hidden');
                loadProducts();
            }
        }

        async function logoutAdmin() {
            await supabaseClient.auth.signOut();
            isAdminLoggedIn = false;
            document.getElementById('adminLoginForm').classList.remove('hidden');
            document.getElementById('adminUploadForm').classList.add('hidden');
            alert('Logged out');
            loadProducts();
        }

        function filterCategory(cat) {
            currentCategory = cat;
            ['Goats', 'Green Bio Gas', 'Fertilizer'].forEach(c => {
                const btnId = 'btn' + c.replace(/\s+/g, '');
                const btn = document.getElementById(btnId);
                if(btn) {
                    if(c === cat) {
                        btn.className = "px-5 py-2 rounded-full font-bold bg-slate-900 text-white shadow text-xs whitespace-nowrap";
                    } else {
                        btn.className = "px-5 py-2 rounded-full font-bold bg-gray-200 text-gray-700 text-xs whitespace-nowrap";
                    }
                }
            });
            loadProducts();
        }

        function previewImages(input) {
            const previewContainer = document.getElementById('imagePreviewContainer');
            previewContainer.innerHTML = '';
            
            if (input.files.length > 6) {
                alert('Aap maximum 6 images hi select kar sakte hain!');
                input.value = '';
                return;
            }

            for (let i = 0; i < input.files.length; i++) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewContainer.innerHTML += `<img src="${e.target.result}" class="w-14 h-14 object-cover rounded border border-slate-900 shadow-sm">`;
                }
                reader.readAsDataURL(input.files[i]);
            }
        }

        async function loadProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '<p class="col-span-2 text-center text-gray-500 py-10 text-sm">Loading products...</p>';
            
            const { data, error } = await supabaseClient
                .from('products')
                .select('*')
                .eq('category', currentCategory)
                .order('id', { ascending: false });

            if (error) {
                grid.innerHTML = '<p class="col-span-2 text-center text-red-500 text-sm">Error loading products</p>';
                return;
            }

            if (data.length === 0) {
                grid.innerHTML = '<p class="col-span-2 text-center text-gray-500 py-10 text-sm">No products found in this category.</p>';
                return;
            }

            grid.innerHTML = '';
            data.forEach(p => {
                let imagesHtml = '';
                if (p.images && p.images.length > 0 && p.images[0]) {
                    imagesHtml = `<img id="mainImg_${p.id}" src="${p.images[0]}" alt="${p.title}" class="w-full h-48 object-cover cursor-pointer hover:scale-105 transition" onclick="window.open('${p.images[0]}', '_blank')">`;
                    
                    if (p.images.length > 1) {
                        imagesHtml += `<div class="flex gap-1 p-1 overflow-x-auto bg-gray-100">`;
                        p.images.forEach((imgUrl) => {
                            imagesHtml += `<img src="${imgUrl}" class="w-9 h-9 object-cover rounded cursor-pointer border hover:border-slate-900" onclick="document.getElementById('mainImg_${p.id}').src='${imgUrl}'; document.getElementById('mainImg_${p.id}').onclick = () => window.open('${imgUrl}', '_blank');">`;
                        });
                        imagesHtml += `</div>`;
                    }
                } else {
                    imagesHtml = `<div class="w-full h-48 bg-gray-200 flex items-center justify-center text-gray-400 text-xs">No Image</div>`;
                }

                const firstImg = (p.images && p.images.length > 0) ? p.images[0] : '';
                const whatsappMsg = encodeURIComponent(`Salam! Mujhe FairJ Goat Farming (Islamabad) se yeh product order karna hai:\nProduct: ${p.title}\nPrice: Rs. ${p.price}\nStock: ${p.stock || 'In Stock'}\nDetails: ${p.description}\nImage: ${firstImg}`);
                
                let deleteBtn = isAdminLoggedIn ? `<button onclick="deleteProduct(${p.id})" class="mt-2 w-full bg-red-500 text-white py-1 rounded text-xs font-bold hover:bg-red-600">🗑️ Delete Product</button>` : '';

                grid.innerHTML += `
                    <div class="bg-white rounded-lg shadow overflow-hidden flex flex-col justify-between p-2">
                        <div>
                            ${imagesHtml}
                            <div class="p-2">
                                <h3 class="font-bold text-gray-800 text-sm mb-1">${p.title}</h3>
                                <p class="text-xs text-gray-500 mb-1">${p.description || ''}</p>
                                <p class="text-xs text-green-600 font-semibold mb-2">📦 ${p.stock || 'In Stock'}</p>
                                <p class="text-slate-900 font-extrabold text-sm mb-2">Rs. ${p.price}</p>
                            </div>
                        </div>
                        <div>
                            <a href="https://wa.me/923182374345?text=${whatsappMsg}" target="_blank" class="block text-center bg-green-500 text-white py-2 rounded text-xs font-bold shadow hover:bg-green-600">Order via WhatsApp</a>
                            ${deleteBtn}
                        </div>
                    </div>
                `;
            });
        }

        async function uploadProduct() {
            const title = document.getElementById('pTitle').value;
            const category = document.getElementById('pCategory').value;
            const price = document.getElementById('pPrice').value;
            const stock = document.getElementById('pStock').value;
            const description = document.getElementById('pDesc').value;
            const fileInput = document.getElementById('pImage');

            if (!title || !price || fileInput.files.length === 0) {
                alert('Please fill title, price and select at least one image!');
                return;
            }

            if (fileInput.files.length > 6) {
                alert('Aap maximum 6 images hi select kar sakte hain!');
                return;
            }

            alert('Uploading images, please wait...');
            let uploadedUrls = [];

            for (let i = 0; i < fileInput.files.length; i++) {
                const file = fileInput.files[i];
                const fileName = Date.now() + '_' + i + '_' + file.name.replace(/[^a-zA-Z0-9_.-]/g, '');

                const { data, error } = await supabaseClient.storage.from('product-images').upload(fileName, file);
                
                if (error) {
                    alert(`Image ${i+1} Upload Error: ` + error.message);
                    return;
                }

                const publicUrl = `https://nsfragzhdzekjqapdjfs.supabase.co/storage/v1/object/public/product-images/${fileName}`;
                uploadedUrls.push(publicUrl);
            }

            const { error: dbError } = await supabaseClient.from('products').insert([
                { title, category, price: parseFloat(price), stock, description, images: uploadedUrls }
            ]);

            if (dbError) {
                alert('Error saving product: ' + dbError.message);
            } else {
                alert('Products and images uploaded successfully!');
                document.getElementById('pTitle').value = '';
                document.getElementById('pPrice').value = '';
                document.getElementById('pDesc').value = '';
                document.getElementById('pImage').value = '';
                document.getElementById('imagePreviewContainer').innerHTML = '';
                toggleAdminModal();
                loadProducts();
            }
        }

        async function deleteProduct(id) {
            if (confirm('Kya aap waqai is product ko delete karna chahte hain?')) {
                const { error } = await supabaseClient.from('products').delete().eq('id', id);
                if (error) {
                    alert('Error deleting product: ' + error.message);
                } else {
                    alert('Product deleted successfully!');
                    loadProducts();
                }
            }
        }

        loadProducts();
    </script>
</body>
</html>
